<html>
<head>
    <title>{{TITLE}}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="{{COLOR_SCHEME}}">
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
        --top-inset: {{TOP_INSET}}px;
    }
    html { height: 100%; }
    body {
        min-height: 100%;
        font-family: -apple-system, sans-serif;
        background: #fff;
        color: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: var(--top-inset) 24px 0 24px;
    }
    body.searching .top-spacer,
    body.searching .bottom-spacer,
    body.searching .wordmark,
    body.searching .grid { display: none; }
    body.searching { padding-top: calc(var(--top-inset) + 16px); }
    
    .top-spacer { flex: 2; min-height: 24px; }
    .bottom-spacer { flex: 5; min-height: 24px; }
    
    .wordmark {
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 1px;
        margin-bottom: 28px;
        color: #000;
        text-decoration: none;
    }
    .search-wrap {
        width: 100%;
        max-width: 480px;
        border: 2px solid #000;
        border-radius: 28px;
        margin-bottom: 36px;
        background: #fff;
        overflow: hidden;
    }
    .search-bar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 20px;
    }
    .search-bar svg { flex-shrink: 0; color: #000; }
    .input-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
    .search-bar input {
        width: 100%;
        min-width: 0;
        border: none;
        outline: none;
        background: transparent;
        color: #000;
        font-size: 16px;
        font-family: inherit;
        padding: 0;
        caret-animation: manual;
    }
    .search-bar input::placeholder { color: #555; }
    
    body.fakecaret .search-bar input { caret-color: transparent; }
    #caretMirror {
        position: absolute; top: 0; left: 0; visibility: hidden;
        white-space: pre; font-size: 16px; font-family: inherit;
    }
    #fakeCaret {
        display: none; position: absolute; top: 50%;
        transform: translateY(-50%); width: 2px; height: 22px;
        background: #000; pointer-events: none;
    }
    body.fakecaret.caret-on #fakeCaret { display: block; }
    
    .sugg { display: none; border-top: 1.5px solid #000; }
    .sugg .row { padding: 10px 20px; }
    .sugg .row:active { background: #e0e0e0; }
    .sugg .row + .row { border-top: 1px solid #bbb; }
    .sugg .t {
        font-size: 14px; font-weight: 600; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
    }
    .sugg .u {
        font-size: 11px; color: #555; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
    }
    
    .grid {
        display: flex; flex-wrap: wrap; justify-content: center;
        gap: 20px 8px; width: 100%; max-width: 480px; margin-bottom: 20px;
    }
    .tile {
        display: flex; flex-direction: column; align-items: center;
        gap: 8px; text-decoration: none; color: #000; width: 76px;
    }
    .tile-icon {
        position: relative; /* Добавлено для позиционирования индикатора */
        width: 60px; height: 60px;
        border: 1.5px solid #000;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
    }
    .tile:active .tile-icon { background: #e0e0e0; }
    .tile-icon img { width: 32px; height: 32px; object-fit: contain; }
    .tile-icon .fallback {
        display: none; align-items: center; justify-content: center;
        font-size: 26px; font-weight: 700; width: 100%; height: 100%;
    }
    .tile-name {
        font-size: 12px; font-weight: 500; max-width: 100%;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* --- Стили для индикатора доступности --- */
    .status-indicator {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #999; /* Серый: проверка */
        border: 1.5px solid #fff;
        transition: background-color 0.3s ease;
        z-index: 2;
    }
    .status-indicator.online {
        background-color: #2ecc71; /* Зелёный: доступен */
    }
    .status-indicator.offline {
        background-color: #e74c3c; /* Красный: недоступен */
    }

    /* Dark theme */
    body.dark { background: #000; color: #fff; }
    body.dark .wordmark { color: #fff; }
    body.dark .search-wrap { border-color: #fff; background: #000; }
    body.dark .search-bar svg { color: #fff; }
    body.dark .search-bar input { color: #fff; }
    body.dark .search-bar input::placeholder { color: #999; }
    body.dark #fakeCaret { background: #fff; }
    body.dark .sugg { border-top-color: #fff; }
    body.dark .sugg .row:active { background: #333; }
    body.dark .sugg .row + .row { border-top-color: #666; }
    body.dark .sugg .u { color: #999; }
    body.dark .tile { color: #fff; }
    body.dark .tile-icon { background: #fff; }
    body.dark .tile-icon svg { color: #000; }
    body.dark .tile-icon .fallback { color: #000; }
    body.dark .status-indicator { border-color: #000; }
    </style>
    {{BG_STYLE}}
</head>
<body class="{{THEME_CLASS}}">
    <div class="top-spacer"></div>
    <div class="grid">

        <!-- DeepSeek -->
        <a class="tile" href="https://chat.deepseek.com/">
            <div class="tile-icon">
                <div class="status-indicator" title="Проверка..."></div>
                <img src="https://deepseek.com/favicon.ico" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="fallback">D</div>

            <div class="tile-name">DeepSeek</div>

        <!-- DeepSeek -->
        <a class="tile" href="https://kimi.com/">
            <div class="tile-icon">
                <div class="status-indicator" title="Проверка..."></div>
                <img src="https://kimi.com/favicon.ico" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div class="fallback">K</div>
            </div>
            <div class="tile-name">Kimi</div>
        </a>
    </div>
    <a class="wordmark" href="browser://config_start_page">{{TITLE}}</a>
    <div class="search-wrap">
        <div class="search-bar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <circle cx="10.5" cy="10.5" r="6.5"/>
                <line x1="15.5" y1="15.5" x2="21" y2="21"/>
            </svg>
            <div class="input-wrap">
                <input id="searchInput" type="text" placeholder="{{SEARCH_HINT}}"
                       autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go">
                <span id="caretMirror"></span>
                <span id="fakeCaret"></span>
            </div>
        </div>
        <div class="sugg" id="suggList"></div>
    </div>
    <div class="grid">
        {{CONTENT}}
        <a class="tile" href="browser://add_start_item">
            <div class="tile-icon">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
            </div>
            <div class="tile-name">{{ADD_LABEL}}</div>
        </a>
    </div>
    <div class="bottom-spacer"></div>
    <script>
    (function() {
        var input = document.getElementById('searchInput');
        var list = document.getElementById('suggList');
        var timer = null;
        var token = 0;

        function bridge() {
            return window.einkbroStartPage;
        }

        function request(query) {
            if (!bridge()) return;
            token++;
            bridge().querySuggestions(query, token);
        }

        window.__einkbroSuggestions = function(t, items) {
            if (t !== token) return;
            render(items);
        };

        function render(items) {
            list.innerHTML = '';
            if (!items || !items.length || document.activeElement !== input) {
                list.style.display = 'none';
                return;
            }
            items.forEach(function(item) {
                var row = document.createElement('div');
                row.className = 'row';
                var title = document.createElement('div');
                title.className = 't';
                title.textContent = item.title || item.url;
                row.appendChild(title);
                if (!item.s && item.url) {
                    var url = document.createElement('div');
                    url.className = 'u';
                    url.textContent = item.url;
                    row.appendChild(url);
                }
                row.addEventListener('pointerdown', function(e) {
                    e.preventDefault();
                });
                row.addEventListener('click', function() {
                    go(item.url || item.title);
                });
                list.appendChild(row);
            });
            list.style.display = 'block';
        }

        function go(text) {
            if (bridge() && text) bridge().submit(text);
        }

        var supportsStaticCaret =
            window.CSS && CSS.supports && CSS.supports('caret-animation', 'manual');
        var mirror = document.getElementById('caretMirror');
        var fakeCaret = document.getElementById('fakeCaret');
        function updateCaret() {
            var end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
            mirror.textContent = input.value.slice(0, end);
            var x = mirror.offsetWidth - input.scrollLeft;
            fakeCaret.style.left = Math.max(0, Math.min(x, input.clientWidth - 2)) + 'px';
        }
        if (!supportsStaticCaret) {
            document.body.classList.add('fakecaret');
            ['input', 'click', 'keyup'].forEach(function(ev) {
                input.addEventListener(ev, function() {
                    requestAnimationFrame(updateCaret);
                });
            });
        }

        input.addEventListener('input', function() {
            clearTimeout(timer);
            var value = input.value;
            timer = setTimeout(function() { request(value); }, 300);
        });
        input.addEventListener('focus', function() {
            if (!bridge()) {
                input.blur();
                location.href = 'browser://focus_input';
                return;
            }
            document.body.classList.add('searching');
            document.body.classList.add('caret-on');
            requestAnimationFrame(updateCaret);
            request(input.value);
        });
        input.addEventListener('blur', function() {
            setTimeout(function() {
                list.style.display = 'none';
                document.body.classList.remove('searching');
                document.body.classList.remove('caret-on');
            }, 150);
        });
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                go(input.value);
            }
        });

        if (window.visualViewport) {
            var fullHeight = window.visualViewport.height;
            var keyboardSeen = false;
            var restoreTimer = null;
            window.visualViewport.addEventListener('resize', function() {
                var height = window.visualViewport.height;
                if (document.activeElement !== input) {
                    fullHeight = height;
                    keyboardSeen = false;
                    return;
                }
                if (height > fullHeight) fullHeight = height;
                clearTimeout(restoreTimer);
                if (height < fullHeight * 0.7) {
                    keyboardSeen = true;
                } else if (keyboardSeen && height >= fullHeight * 0.9) {
                    restoreTimer = setTimeout(function() { input.blur(); }, 100);
                }
            });
        }

        // ==========================================
        // ЛОГИКА ПРОВЕРКИ ДОСТУПНОСТИ САЙТОВ
        // ==========================================
        function checkSiteAvailability() {
            var tiles = document.querySelectorAll('.tile');
            tiles.forEach(function(tile, index) {
                var url = tile.href;
                var indicator = tile.querySelector('.status-indicator');
                if (!indicator || !url || url.startsWith('browser://')) return;

                // Небольшая задержка для каждого следующего сайта, чтобы не "положить" сеть одновременными запросами
                setTimeout(function() {
                    var controller = new AbortController();
                    var timeoutId = setTimeout(function() { controller.abort(); }, 4000); // 4 секунды таймаут

                    // Пробуем лёгкий HEAD-запрос в режиме no-cors (обходит ограничения CORS для проверки факта ответа сервера)
                    fetch(url, { method: 'HEAD', mode: 'no-cors', signal: controller.signal, cache: 'no-store' })
                        .then(function() {
                            indicator.classList.add('online');
                            indicator.title = 'Сайт доступен';
                        })
                        .catch(function() {
                            // Если HEAD заблокирован, пробуем обычный GET
                            var controller2 = new AbortController();
                            var timeoutId2 = setTimeout(function() { controller2.abort(); }, 4000);
                            fetch(url, { method: 'GET', mode: 'no-cors', signal: controller2.signal, cache: 'no-store' })
                                .then(function() {
                                    indicator.classList.add('online');
                                    indicator.title = 'Сайт доступен';
                                })
                                .catch(function() {
                                    indicator.classList.add('offline');
                                    indicator.title = 'Сайт недоступен или превышено время ожидания';
                                })
                                .finally(function() { clearTimeout(timeoutId2); });
                        })
                        .finally(function() {
                            clearTimeout(timeoutId);
                        });
                }, index * 150); // 150 мс между запросами
            });
        }

        // Запускаем проверку после загрузки DOM
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', checkSiteAvailability);
        } else {
            checkSiteAvailability();
        }
    })();
    </script>
</body>
</html>
